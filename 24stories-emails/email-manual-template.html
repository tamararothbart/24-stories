<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>24 Stories — Manual Email Template</title>
<style>
  body { margin: 0; padding: 0; background: #E8E4DF; font-family: Georgia, serif; }
  .wrapper { max-width: 640px; margin: 40px auto; padding: 0 20px 60px; }
  .email { background: #F7F5F2; padding: 48px 40px; color: #1A1A1A; }
  p { font-size: 17px; line-height: 1.9; margin: 0 0 22px 0; }
  .divider { border: none; border-top: 1px solid #D0CCC6; margin: 36px 0; }
  .signature-name { font-size: 17px; font-weight: bold; margin: 0 0 4px 0; color: #1A1A1A; }
  .signature-title { font-size: 14px; color: #888; margin: 0 0 4px 0; letter-spacing: 0.04em; }
  .signature-contact { font-size: 14px; color: #888; margin: 0 0 44px 0; }
  .signature-contact a { color: #B8976A; text-decoration: none; }
  .quote { font-size: 16px; font-style: italic; color: #555; line-height: 1.8; margin: 0 0 6px 0; }
  .quote-attribution { font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: #B8976A; margin: 0; }
  .footer { margin-top: 32px; padding-top: 24px; border-top: 1px solid #D0CCC6; font-size: 13px; color: #999; font-family: Arial, sans-serif; text-align: center; line-height: 1.7; }
  .footer a { color: #B8976A; text-decoration: none; }
</style>
</head>
<body>

<div class="wrapper">
<div class="email">

  <!-- LOGO -->
  <img src="https://24stories.co.za/logo.png" alt="24 Stories" width="220" style="display:block; border:0; max-width:100%; height:auto; margin-bottom:40px; margin-left:auto;">

  <!-- ═══════════════════════════════════════════
       YOUR MESSAGE — replace everything below
       up to the divider with your own content
  ═══════════════════════════════════════════ -->

  <p>Hello [Name],</p>

  <p>[Write your message here.]</p>

  <!-- ═══════════════════════════════════════════
       END OF MESSAGE — do not edit below this line
  ═══════════════════════════════════════════ -->

  <hr class="divider">

  <p class="signature-name">The 24 Stories Team</p>
  <p class="signature-contact">
    <a href="mailto:hello@24stories.co.za">hello@24stories.co.za</a>
    &nbsp;·&nbsp;
    <a href="https://www.24stories.co.za">24stories.co.za</a>
  </p>

  <p class="quote">"Stories have to be told or they die, and when they die,<br>we can't remember who we are or why we're here."</p>
  <p class="quote-attribution">— S.M. Kidd</p>

</div>

<div class="footer">
  &copy; 2026 24 Stories &nbsp;·&nbsp; 24stories.co.za &nbsp;·&nbsp; Cape Town, South Africa
</div>
</div>

</body>
</html>
