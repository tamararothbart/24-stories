<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>24 Stories — Edit Story</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --charcoal: #1A1A1A;
    --gold: #B8976A;
    --cream: #F7F5F2;
    --border: #E0DCD7;
    --red: #C0392B;
    --green: #2E7D52;
  }

  html, body {
    height: 100%;
    font-family: Georgia, serif;
    background: var(--cream);
    color: var(--charcoal);
  }

  /* ---- HEADER ---- */
  .editor-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 28px;
    background: var(--charcoal);
    color: #fff;
    flex-shrink: 0;
    gap: 20px;
    flex-wrap: wrap;
  }

  .header-left {
    display: flex;
    flex-direction: column;
    gap: 3px;
  }

  .header-eyebrow {
    font-size: 0.65rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    font-family: Georgia, serif;
  }

  .header-title {
    font-size: 1rem;
    font-weight: normal;
    color: #fff;
    font-family: Georgia, serif;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-shrink: 0;
  }

  .save-status {
    font-size: 0.78rem;
    color: #aaa;
    font-family: Georgia, serif;
    font-style: italic;
    min-width: 80px;
    text-align: right;
  }

  .save-status.saving { color: var(--gold); }
  .save-status.saved  { color: #7dc97d; }
  .save-status.error  { color: var(--red); }

  .btn-library {
    background: var(--gold);
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-family: Georgia, serif;
    font-size: 0.82rem;
    letter-spacing: 0.06em;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    white-space: nowrap;
    transition: opacity 0.2s;
  }

  .btn-library:hover { opacity: 0.85; }

  /* ---- META BAR ---- */
  .meta-bar {
    padding: 10px 28px;
    background: #fff;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 24px;
    flex-wrap: wrap;
    flex-shrink: 0;
  }

  .meta-item {
    font-size: 0.78rem;
    color: #888;
    font-family: Georgia, serif;
  }

  .meta-item strong {
    color: var(--charcoal);
    font-weight: normal;
  }

  .word-count {
    margin-left: auto;
    font-size: 0.78rem;
    color: #aaa;
    font-style: italic;
  }

  /* ---- EDITOR AREA ---- */
  .editor-wrap {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 28px;
    min-height: 0;
  }

  .editor-label {
    font-size: 0.65rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--gold);
    margin-bottom: 10px;
  }

  #editedText {
    flex: 1;
    width: 100%;
    border: 1px solid var(--border);
    padding: 28px 32px;
    font-family: Georgia, serif;
    font-size: 1rem;
    line-height: 1.9;
    color: var(--charcoal);
    background: #fff;
    resize: none;
    outline: none;
    min-height: calc(100vh - 200px);
    transition: border-color 0.2s;
  }

  #editedText:focus { border-color: var(--gold); }

  /* ---- LOADING / ERROR STATES ---- */
  .state-loading,
  .state-error {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    font-family: Georgia, serif;
    font-size: 1rem;
    color: #888;
    font-style: italic;
  }

  .state-error { color: var(--red); }

  /* ---- LAYOUT ---- */
  body {
    display: flex;
    flex-direction: column;
  }

  .page-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
</style>
</head>
<body>

<div class="editor-header">
  <div class="header-left">
    <p class="header-eyebrow">24 Stories — Story Editor</p>
    <p class="header-title" id="headerTitle">Loading...</p>
  </div>
  <div class="header-right">
    <span class="save-status" id="saveStatus"></span>
    <a class="btn-library" id="libraryBtn" href="#" target="_blank">Open Story Library &rarr;</a>
  </div>
</div>

<div class="meta-bar" id="metaBar" style="display:none;">
  <span class="meta-item">Storyteller: <strong id="metaName"></strong></span>
  <span class="meta-item">Week: <strong id="metaWeek"></strong></span>
  <span class="meta-item">Theme: <strong id="metaTheme"></strong></span>
  <span class="word-count" id="wordCount"></span>
</div>

<div class="page-body" id="pageBody">
  <div class="state-loading" id="stateLoading">Loading story...</div>
  <div class="state-error" id="stateError" style="display:none;">Story not found. Check the URL and try again.</div>
  <div class="editor-wrap" id="editorWrap" style="display:none;">
    <p class="editor-label">Edited Text — auto-saves as you type</p>
    <textarea id="editedText" spellcheck="true" autocorrect="on"></textarea>
  </div>
</div>

<script>
  var storyId    = new URLSearchParams(window.location.search).get('story') || '';
  var saveTimer  = null;
  var lastSaved  = '';

  function show(id) {
    ['stateLoading','stateError','editorWrap'].forEach(function(s) {
      document.getElementById(s).style.display = s === id ? '' : 'none';
    });
  }

  function updateWordCount() {
    var text  = document.getElementById('editedText').value.trim();
    var words = text ? text.split(/\s+/).length : 0;
    document.getElementById('wordCount').textContent = words + ' word' + (words === 1 ? '' : 's');
  }

  function setStatus(state, msg) {
    var el = document.getElementById('saveStatus');
    el.className = 'save-status ' + state;
    el.textContent = msg;
  }

  function save() {
    var text = document.getElementById('editedText').value;
    if (text === lastSaved) return;
    setStatus('saving', 'Saving...');
    fetch('/.netlify/functions/story-save', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ storyId: storyId, editedText: text })
    })
    .then(function(r) {
      if (!r.ok) throw new Error('Save failed');
      lastSaved = text;
      var now = new Date();
      var t   = now.getHours() + ':' + String(now.getMinutes()).padStart(2,'0');
      setStatus('saved', 'Saved ' + t);
    })
    .catch(function() {
      setStatus('error', 'Save failed — check connection');
    });
  }

  if (!storyId) {
    show('stateError');
  } else {
    fetch('/.netlify/functions/story-load?id=' + encodeURIComponent(storyId))
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (!data.story || data.story.error) { show('stateError'); return; }

      var f    = data.story.fields;
      var sub  = data.subscriber ? data.subscriber.fields : {};
      var p    = data.prompt || {};

      var firstName = sub.StorytellerFirstName || '';
      var surname   = sub.StorytellerSurname   || '';
      var name      = [firstName, surname].filter(Boolean).join(' ') || 'Subscriber';
      var week      = f.PromptNumber || '';
      var weekName  = p.WeekName     || '';
      var theme     = p.Theme        || f.WeekTheme || '';
      var subId     = (f.SubscriberID || [])[0] || '';

      document.getElementById('headerTitle').textContent = name + ' — Week ' + week + (weekName ? ' · ' + weekName.trim() : '');
      document.getElementById('metaName').textContent  = name;
      document.getElementById('metaWeek').textContent  = 'Week ' + week + (weekName ? ' — ' + weekName.trim() : '');
      document.getElementById('metaTheme').textContent = theme;
      document.getElementById('metaBar').style.display = '';

      if (subId) {
        document.getElementById('libraryBtn').href = '/library.html?id=' + subId;
      }

      var text = f.EditedText || f.StoryText || '';
      document.getElementById('editedText').value = text;
      lastSaved = text;
      updateWordCount();
      show('editorWrap');

      document.getElementById('editedText').addEventListener('input', function() {
        updateWordCount();
        setStatus('', '');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(save, 2000);
      });

      window.addEventListener('beforeunload', function() {
        var text = document.getElementById('editedText').value;
        if (text !== lastSaved) save();
      });
    })
    .catch(function() { show('stateError'); });
  }
</script>
</body>
</html>
