[functions]
  directory = "netlify/functions"

[functions.transcribe]
  timeout = 26

[functions.cleanup]
  timeout = 26

# Scheduled functions — all times UTC (SAST = UTC+2)
[functions.send-weekly-prompts]
  schedule = "0 5 * * 3"   # every Wednesday 7am SAST

[functions.send-day4-reminder]
  schedule = "0 6 * * 6"   # every Saturday 8am SAST

[functions.book-onboarding-reminder]
  schedule = "0 7 * * *"   # every day 9am SAST
