[functions]
  directory = "netlify/functions"

[functions.transcribe]
  timeout = 26

[functions.cleanup]
  timeout = 26

[functions.free-download]
  timeout = 26

[functions.early-interest]
  timeout = 26

[functions.events-inquiry]
  timeout = 26

[functions.story-application]
  timeout = 26

[functions.coaching-inquiry]
  timeout = 26

[functions.admin-enroll]
  timeout = 26

[functions.guide-download]
  timeout = 26

# Scheduled functions — all times UTC (SAST = UTC+2)
[functions.send-weekly-prompts]
  schedule = "0 5 * * 3"   # every Wednesday 7am SAST

[functions.send-day4-reminder]
  schedule = "0 6 * * 6"   # every Saturday 8am SAST

[functions.book-onboarding-reminder]
  schedule = "0 7 * * *"   # every day 9am SAST

[functions.send-story-queue]
  schedule = "*/2 * * * *"  # every 2 minutes — checks for SendToFamily checkbox

[functions.text-edit-queue]
  schedule = "*/5 * * * *"  # every 5 minutes — AI structural editing for newly submitted stories
  timeout = 60
