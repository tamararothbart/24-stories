<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thank You — 24 Stories</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
    .thankyou-page {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 60px 24px;
        background: var(--charcoal);
    }
    .thankyou-page img { height: 52px; margin-bottom: 40px; opacity: .85; }
    .thankyou-page h1 {
        font-family: var(--font-head);
        font-size: clamp(2rem, 5vw, 3.2rem);
        font-weight: 300;
        color: var(--cream);
        margin-bottom: 20px;
        line-height: 1.2;
    }
    .thankyou-page p {
        font-size: 1rem;
        color: rgba(247,245,242,0.6);
        max-width: 480px;
        line-height: 1.85;
        margin-bottom: 14px;
    }
    .thankyou-divider {
        width: 40px;
        height: 1px;
        background: var(--gold);
        margin: 28px auto;
        opacity: .5;
    }
    .thankyou-links {
        display: flex;
        gap: 16px;
        justify-content: center;
        flex-wrap: wrap;
        margin-top: 32px;
    }
    </style>
</head>
<body>
    <div class="thankyou-page">
        <img src="logo.png" alt="24 Stories">
        <h1>Thank you.</h1>
        <div class="thankyou-divider"></div>
        <p>We have received your submission and will be in touch personally.</p>
        <p>In the meantime, if you have any questions write to us at <a href="mailto:hello@24stories.co.za" style="color:var(--gold);">hello@24stories.co.za</a>.</p>
        <div class="thankyou-links">
            <a href="events.html" class="btn btn-ghost">Back to Events</a>
            <a href="index.html" class="btn btn-ghost">Main Site</a>
        </div>
    </div>
</body>
</html>
